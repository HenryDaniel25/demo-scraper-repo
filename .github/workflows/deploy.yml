name: Python scraper CI/CD

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # ✅ 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ✅ 3. Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # ✅ 4. Retag old latest and push new latest
      - name: Retag old latest and push new latest
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY

          echo "🔍 Checking for existing latest image..."

          # Get current latest image manifest
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=latest \
            --query 'images[0].imageManifest' \
            --output text 2>/dev/null || echo "NONE")

          if [ "$MANIFEST" != "NONE" ]; then
            echo "📦 Found old latest image"

            # Generate timestamp version
            VERSION_TAG="v$(date +%Y%m%d%H%M%S)"

            echo "🔖 Retagging old latest as $VERSION_TAG"

            aws ecr put-image \
              --repository-name $ECR_REPOSITORY \
              --image-tag $VERSION_TAG \
              --image-manifest "$MANIFEST"
          else
            echo "⚠️ No previous latest image found (first run)"
          fi

          echo "🚀 Building new image as latest..."
          docker build -t $IMAGE_URI:latest .

          echo "📤 Pushing new latest image..."
          docker push $IMAGE_URI:latest
